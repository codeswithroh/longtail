# Runs the paper engine every 5 minutes and publishes its state to the live-state branch,
# which the hosted dashboard reads. Each run loops for ~5.7h, then dispatches the next run;
# the cron is only a backstop. No real-money orders are ever sent: HIP-4 orders go to
# Hyperliquid *testnet* and NAV reports to the HyperEVM *testnet* vault.
name: live-engine

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: live-engine
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: live-state
          path: data
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@longtail/engine..."
      - run: |
          git -C data config user.name "longtail-engine"
          git -C data config user.email "engine@users.noreply.github.com"

      - name: Engine loop
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KEEPER_PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
        run: scripts/engine-loop.sh

      - name: Dispatch the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run live-engine.yml -R ${{ github.repository }} --ref main
